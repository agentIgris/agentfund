<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AgentFund - Fundraising infrastructure for AI agents">
  <title>AgentFund</title>
  <defs>
    <radialGradient id="af-bg-grad" cx="30%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="60%" stop-color="#07070d"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="af-flow-violet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="af-flow-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="af-crossbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="af-node" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
    <linearGradient id="af-wordmark-fund" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#af-bg-grad)"/>

  <!-- faint starfield dots for depth -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="120" cy="90" r="1.6"/>
    <circle cx="220" cy="470" r="1.3"/>
    <circle cx="980" cy="110" r="1.6"/>
    <circle cx="1080" cy="520" r="1.3"/>
    <circle cx="860" cy="80" r="1.2"/>
    <circle cx="150" cy="330" r="1.2"/>
    <circle cx="1050" cy="330" r="1.5"/>
    <circle cx="60" cy="560" r="1.3"/>
    <circle cx="1140" cy="440" r="1.2"/>
  </g>

  <!-- ============ MARK (200x200, centered horizontally, upper area) ============ -->
  <g transform="translate(500,54)">
    <path d="M 106 78
             C 90 112, 60 152, 40 192
             L 82 192
             C 96 158, 108 120, 118 84
             Z" fill="url(#af-flow-violet)"/>
    <path d="M 134 78
             C 150 112, 180 152, 200 192
             L 158 192
             C 144 158, 132 120, 122 84
             Z" fill="url(#af-flow-cyan)"/>

    <rect x="72" y="142" width="96" height="12" rx="6" fill="url(#af-crossbar)" opacity="0.92"/>
    <circle cx="100" cy="148" r="4.5" fill="#050508"/>
    <circle cx="120" cy="148" r="4.5" fill="#050508"/>
    <circle cx="140" cy="148" r="4.5" fill="#050508"/>

    <circle cx="42" cy="192" r="6" fill="#67e8f9"/>
    <circle cx="198" cy="192" r="6" fill="#a78bfa"/>

    <circle cx="120" cy="66" r="24" fill="url(#af-node)"/>
    <circle cx="120" cy="66" r="8" fill="#f5f3ff"/>
  </g>

  <!-- ============ WORDMARK ============ -->
  <text x="600" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="88" letter-spacing="1" fill="#f5f3ff">Agent<tspan fill="url(#af-wordmark-fund)">Fund</tspan></text>

  <!-- ============ TAGLINE ============ -->
  <text x="600" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="30" letter-spacing="0.5" fill="#a1a1b5">Fundraising infrastructure for AI agents</text>
</svg>

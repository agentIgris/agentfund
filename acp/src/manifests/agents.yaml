# GENERATED FILE — do not hand-edit.
# Regenerate with `npm run gen:manifest --workspace acp` after changing
# src/manifests/agents.ts. This is a static mirror of what GET /agents
# returns at runtime (spec: "GET /agents -> manifest list (also mirror
# as src/manifests/agents.yaml)").
agents:
  - agent_id: FundRaisingAgent
    description: Creates and manages a fundraising campaign on Solana
    async: true
    input_schema:
      type: object
      required:
        - title
        - description
        - goal_usdc
        - milestones
        - deadline_days
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        goal_usdc:
          type: number
          exclusiveMinimum: 0
          description: Human-readable USDC, e.g. 25000
        milestones:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required:
              - description
              - amount_usdc
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 500
              amount_usdc:
                type: number
                exclusiveMinimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        deadline_days:
          type: integer
          exclusiveMinimum: 0
          maximum: 3650
    output_schema:
      type: object
      required:
        - project_id
        - project_url
        - unsigned_tx
        - solscan_url
      properties:
        project_id:
          type: string
        project_url:
          type: string
          format: uri
        unsigned_tx:
          type: string
          description: Base64-encoded unsigned Solana transaction
        solscan_url:
          type: string
          format: uri

  - agent_id: ProjectEvaluatorAgent
    description: Evaluates project quality and returns trust score
    async: false
    input_schema:
      type: object
      required:
        - project_id
      properties:
        project_id:
          type: string
          description: Project PDA pubkey (base58)
    output_schema:
      type: object
      required:
        - score
        - recommendation
        - risk_flags
        - on_chain_verified
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        recommendation:
          type: string
          enum:
            - strong_fund
            - fund
            - caution
            - avoid
        risk_flags:
          type: array
          items:
            type: string
        on_chain_verified:
          type: boolean

  - agent_id: DonationAgent
    description: Contributes SOL or USDC to a project
    async: false
    input_schema:
      type: object
      required:
        - project_id
        - amount
        - token
      properties:
        project_id:
          type: string
          description: Project PDA pubkey (base58)
        amount:
          type: number
          exclusiveMinimum: 0
          description: Human units (SOL or USDC), not lamports/micro-units
        token:
          type: string
          enum:
            - SOL
            - USDC
    output_schema:
      type: object
      required:
        - unsigned_tx
        - expected_sig
        - confirmation_url
      properties:
        unsigned_tx:
          type: string
          description: Base64-encoded unsigned Solana transaction
        expected_sig:
          type:
            - string
            - "null"
          description: Always null pre-signing — see README
        confirmation_url:
          type: string

  - agent_id: MonitorAgent
    description: Watches a project and streams events back to caller via ACP
    async: true
    input_schema:
      type: object
      required:
        - project_id
        - events
      properties:
        project_id:
          type: string
          description: Project PDA pubkey (base58)
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - milestone
              - goal_reached
              - vote
              - refund
    output_schema:
      description: >-
        stream<AgentEvent> — pushed asynchronously as { status: "running",
        output_chunk: AgentEvent } SSE events on GET /runs/:id/events; there
        is no single final output while the client stays connected.
      type: object
      properties:
        type:
          type: string
        data:
          type: object

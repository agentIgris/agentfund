[registry]
url = "https://api.apr.dev"

[provider]
# Cluster-agnostic: driven by SOLANA_CLUSTER / SOLANA_RPC_URL env vars.
# Anchor CLI itself only reads [provider] statically, so `cluster` here
# is a local-dev default — override at invocation time with
# `--provider.cluster $SOLANA_CLUSTER --provider.url $SOLANA_RPC_URL`.
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

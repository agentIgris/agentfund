# AgentFund backend — single-host production stack (EC2 + Docker Compose).
#   cd deploy && docker compose -f docker-compose.prod.yml up -d --build
# Requires deploy/.env (see .env — never committed) and
# deploy/secrets/platform-wallet.json (devnet keypair, never committed).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentfund
      POSTGRES_DB: agentfund
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfund -d agentfund"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      DATABASE_URL: postgresql://agentfund:${POSTGRES_PASSWORD}@postgres:5432/agentfund
      REDIS_URL: redis://redis:6379
      PLATFORM_WALLET_KEYPAIR_PATH: /secrets/platform-wallet.json
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"

  mcp:
    build:
      context: ..
      dockerfile: deploy/mcp.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3002"
      API_BASE_URL: http://api:4000
    depends_on:
      - api
    expose:
      - "3002"

  acp:
    build:
      context: ..
      dockerfile: deploy/acp.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ACP_HOST: 0.0.0.0
      ACP_PORT: "3003"
      API_BASE_URL: http://api:4000
      FRONTEND_BASE_URL: https://agentfund.online
    depends_on:
      - api
    expose:
      - "3003"

  # Not started by `docker compose up -d` (profile-gated). Triggered once a
  # day by a host cron job: `docker compose --profile outreach run --rm
  # outreach-agent`. See deploy/README.md.
  outreach-agent:
    build:
      context: ..
      dockerfile: deploy/outreach-agent.Dockerfile
    profiles: ["outreach"]
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      OUTREACH_API_URL: http://api:4000
      OUTREACH_WALLET_PATH: /secrets/outreach-wallet.json
      OUTREACH_DATA_DIR: /data
      OUTREACH_LOG_FILE: /data/outreach.log
    volumes:
      - ./secrets:/secrets:ro
      - outreach_data:/data
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  outreach_data:

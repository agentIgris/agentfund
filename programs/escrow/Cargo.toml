[package]
name = "escrow"
version = "0.1.0"
description = "AgentFund: contribution escrow, milestone release, refunds"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# init-if-needed backs ContributionAccount's accumulate-across-repeat-
# contributions semantics (contribute() re-uses the same PDA per
# contributor).
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["associated_token", "token"] }
